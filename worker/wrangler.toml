name = "dev-space-worker"
main = "src/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "dev-space-db"
database_name = "dev-space-db"
database_id = "2376b6d8-33cf-4f98-9995-777726c313aa"

[[r2_buckets]]
binding = "dev_space_r2"
bucket_name = "dev-space-r2"

[[kv_namespaces]]
binding = "dev_space_kv"
id = "46bba3aef1b4444cb0501983e660d5d3"

[[durable_objects.bindings]]
name = "REMINDER_SCHEDULER"
class_name = "ReminderScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReminderScheduler"]

[vars]
ENVIRONMENT = "production"

# Cloudflare Access is handled at the zone level — no code changes needed.
# Add an Access policy for your Pages/Workers domain in the Cloudflare dashboard.
